
name: Build Pranayama APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licences
        shell: bash
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project from ZIP
        shell: bash
        run: |
          if [ ! -f PranayamaAndroid.zip ]; then
            echo "ERROR: PranayamaAndroid.zip is missing."
            exit 1
          fi

          echo "===== ZIP FILE DETAILS ====="
          ls -lh PranayamaAndroid.zip
          sha256sum PranayamaAndroid.zip

          mkdir -p extracted
          unzip -q PranayamaAndroid.zip -d extracted

          APP_BUILD_FILE=$(find extracted -type f -path '*/app/build.gradle.kts' -print -quit)

          if [ -z "$APP_BUILD_FILE" ]; then
            echo "ERROR: app/build.gradle.kts not found inside ZIP."
            find extracted -maxdepth 5 -type f | head -80
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_BUILD_FILE")")

          echo "===== PROJECT DIRECTORY FOUND ====="
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          if [ ! -f app/build.gradle.kts ] || [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Android project files are incomplete."
            exit 1
          fi

          echo "Android project extracted successfully."

          echo "===== VERIFYING MAINACTIVITY FIX ====="
          grep -R -n "fun refreshStats" app/src/main/java/ || true

          echo "===== VERIFYING PRACTICESERVICE FIXES ====="
          grep -R -n "elapsedSeconds()" app/src/main/java/ || true

          echo "===== SOURCE FILE LOCATIONS ====="
          find app/src/main/java -name "*.kt"

          echo "===== VERIFYING JAVA/KOTLIN TARGETS ====="
          grep -n -E "jvmTarget|sourceCompatibility|targetCompatibility" app/build.gradle.kts || true

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -fsSLo /tmp/gradle-8.9-bin.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle-8.9-bin.zip -d /opt/gradle

          echo "/opt/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Check Gradle and project
        shell: bash
        run: |
          gradle --version
          test -f app/build.gradle.kts
          test -f settings.gradle.kts

      - name: Build debug APK
        shell: bash
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pranayama-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
