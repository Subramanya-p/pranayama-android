
name: Build Pranayama APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Diagnose and extract Android project
        run: |
          echo "Checking ZIP file..."
          ls -lh PranayamaAndroid.zip
          file PranayamaAndroid.zip

          echo "Testing ZIP archive..."
          unzip -t PranayamaAndroid.zip

          echo "Extracting ZIP archive..."
          unzip PranayamaAndroid.zip -d extracted

          echo "Looking for Gradle wrapper..."
          find extracted -name gradlew -type f

      - name: Locate and prepare Android project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name gradlew -type f -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: Gradle wrapper not found in ZIP."
            exit 1
          fi
          cp -a "$PROJECT_DIR"/. .

      - name: Check project files
        run: |
          echo "Checking Android project..."
          ls -la
          test -f gradlew
          test -d app
          test -d gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pranayama-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
